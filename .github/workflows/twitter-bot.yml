name: Twitter Bot (CSV)

permissions:
  contents: write  # allow pushing CSV changes

on:
  schedule:
    - cron: "30 3 * * *"   # 9:00 AM IST
    - cron: "30 6 * * *"   # 12:00 PM IST
    - cron: "30 12 * * *"  # 6:00 PM IST
    - cron: "30 15 * * *"  # 9:00 PM IST
  workflow_dispatch:        # allows manual run anytime

jobs:
  tweet:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Twitter bot
        run: python bot.py
        env:
          API_KEY: ${{ secrets.API_KEY }}
          API_SECRET: ${{ secrets.API_SECRET }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          ACCESS_TOKEN_SECRET: ${{ secrets.ACCESS_TOKEN_SECRET }}

      - name: Commit updated CSV
        run: |
          git config user.name "twitter-bot"
          git config user.email "bot@users.noreply.github.com"
          git add tweets.csv
          git commit -m "Mark tweet as posted" || echo "No changes"
          git push
